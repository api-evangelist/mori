name: MORI
description: >-
  MORI (Baby Mori) is a UK-based, online-first baby and children's brand
  founded in 2015 by Akin Onal, known for soft essentials made from a
  proprietary bamboo and organic cotton fabric blend. Its direct-to-consumer
  range spans sleepwear, daywear, footwear, blankets and muslins, nursery and
  home goods, and a Sleep Club subscription, shipping across the UK, US, and
  Europe. MORI operates as a Shopify-hosted e-commerce business and does not
  publish a first-party developer API. Its machine-readable surface is provided
  natively by the Shopify platform: a live Storefront MCP server at /api/mcp
  (search_catalog, get_cart, update_cart, get_product_details,
  search_shop_policies_and_faqs), a Universal Commerce Protocol (UCP) merchant
  profile at /.well-known/ucp, an agent-instructions /llms.txt (mirrored at
  /agents.md), and the Shopify Customer Account API OIDC/OAuth discovery. This
  profile was surfaced as a 500 Global portfolio company and enriched by the
  API Evangelist pipeline.
